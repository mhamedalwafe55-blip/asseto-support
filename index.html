<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيه إلى واتساب...</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; text-align: center; margin-top: 20%; background-color: #f4f6f9; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #25D366; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { display: inline-block; background-color: #25D366; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; font-weight: bold; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h2 style="color: #333;">جاري تحويل طلبك...</h2>
    <div class="loader"></div>
    <p style="color: #666;">سيتم فتح تطبيق الواتساب تلقائياً.</p>
    
    <script>
        // ⚠️ ضع رقم هاتفك هنا مع رمز الدولة، بدون أصفار إضافية أو علامة زائد (مثال: 2189...)
        const PHONE_NUMBER = "218925373243"; 

        window.onload = function() {
            // سحب المتغيرات من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            // قراءة الرسالة المنسقة القادمة من البايثون
            const dataParam = urlParams.get('data');
            
            if (dataParam) {
                // التوجيه إلى واتساب مع فك التشفير السليم للحروف العربية
                const whatsappUrl = "https://wa.me/" + PHONE_NUMBER + "?text=" + encodeURIComponent(dataParam);
                
                // محاولة فتح الواتساب تلقائياً
                window.location.replace(whatsappUrl);
                
                // إضافة زر يدوي في حال كان المتصفح يمنع التوجيه التلقائي
                document.body.innerHTML += '<br><a href="' + whatsappUrl + '" class="btn">اضغط هنا لفتح الواتساب</a>';
            } else {
                // في حال كان الرمز لا يحتوي على بيانات
                document.body.innerHTML = "<h3 style='color:#F44336; margin-top: 20px;'>عذراً، رمز الاستجابة (QR) لا يحتوي على بيانات طلب صحيحة.</h3>";
            }
        };
    </script>
</body>
</html>
